version: 2
updates:
  # npm dependencies at the monorepo root + every workspace package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      # Group minor/patch updates so the inbox stays manageable.
      typescript:
        update-types: [minor, patch]
        patterns:
          - 'typescript'
          - '@types/*'
      vitest:
        update-types: [minor, patch]
        patterns:
          - 'vitest'
          - '@vitest/*'
      decimal:
        update-types: [minor, patch]
        patterns:
          - 'decimal.js'
      zod:
        update-types: [minor, patch]
        patterns:
          - 'zod'
          - 'zod-to-json-schema'
    # Major version bumps and runtime packages get individual PRs so
    # breaking changes are reviewed in isolation. Some packages are
    # pinned to a specific major and must NOT auto-bump:
    #  - @types/node: major must track the Node.js LTS major we run on
    #    (currently 22). Bumping to @types/node@26 tracks Node 26 which
    #    does not exist as LTS and causes type mismatches.
    #  - zod: agentic-runtime declares `zod: ^3.24` as a peer dep. Bumping
    #    research-agent to zod 4 creates a dual-zod install (runtime uses
    #    3.x, agent uses 4.x) — works today but invites subtle breakage.
    #  - typescript: TS 7 is a major breaking change (compiler API,
    #    decorator semantics, module resolution). Must be a manual,
    #    reviewed upgrade — not an auto-bump.
    ignore:
      - dependency-name: '@nemesis-oss/agentic-runtime'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nemesis-oss/ollama-sdk'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'zod'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # Keep GitHub Actions themselves current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci)
      include: scope
