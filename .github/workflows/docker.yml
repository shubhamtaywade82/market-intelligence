name: Docker

# Validates that the production image builds and the API passes a smoke
# test inside the container. Runs on main and PRs that touch the image
# or the API entrypoint.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'packages/market-intelligence-api/**'
      - 'packages/*/src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build:
    name: docker build · smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: market-intelligence-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container /health + graceful SIGTERM)
        run: |
          set -euo pipefail
          docker run -d --name mi-api -p 18080:8080 market-intelligence-api:ci
          trap 'docker rm -f mi-api >/dev/null 2>&1 || true' EXIT

          # Wait for the health endpoint (max ~30s).
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then
              echo "health check passed after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::API did not become healthy within 30s"
              docker logs mi-api
              exit 1
            fi
            sleep 1
          done

          # Security headers must be present.
          curl -fsSI http://127.0.0.1:18080/health | grep -i 'x-content-type-options: nosniff'
          curl -fsSI http://127.0.0.1:18080/health | grep -i 'x-ratelimit-limit'

          # Graceful shutdown: SIGTERM must exit cleanly within 15s.
          docker stop --time=15 mi-api
          echo "container stopped gracefully"
